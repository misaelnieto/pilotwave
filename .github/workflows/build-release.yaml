name: Build & Release

on:
  workflow_dispatch:
    inputs:
      bump_level:
        description: 'Bump level (auto = from conventional commits)'
        type: choice
        options: [auto, major, minor, patch]
        default: auto
      dry_run:
        description: 'Only print the version without publishing'
        type: boolean
        default: false

# Least privilege by default; each job declares its own.
permissions: {}

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit + tag v{version}
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - name: Validate push prerequisites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty. The version commit + tag push is done by python-semantic-release with its own token ([tool.semantic_release.remote] token = GITHUB_TOKEN)."
            exit 1
          fi
          echo "GITHUB_TOKEN present. Requirement: Settings → Actions → General → Workflow permissions = 'Read and write permissions' (if Read-only, the tag push will fail)."

      - uses: actions/checkout@v7
        with:
          # semantic-release needs full tags + history
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run semantic-release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUMP_FLAG=""
          case "${{ inputs.bump_level }}" in
            major) BUMP_FLAG="--major" ;;
            minor) BUMP_FLAG="--minor" ;;
            patch) BUMP_FLAG="--patch" ;;
          esac

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — version that would be published:"
            # --print computes the bump without commit, tag or push
            # shellcheck disable=SC2086
            uv run semantic-release version $BUMP_FLAG --print
            echo "version=" >> $GITHUB_OUTPUT
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # shellcheck disable=SC2086
          uv run semantic-release version $BUMP_FLAG
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$NEW_TAG" ] && [ "$PREV_TAG" != "$NEW_TAG" ]; then
            VERSION=$(echo "$NEW_TAG" | sed 's/^v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "No new release to publish (no conventional commits since $PREV_TAG)"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build wheel (musl) + sdist
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload dists artifact

    steps:
      # Checkout the freshly created TAG (not the workflow SHA nor main
      # LATEST): semantic-release pushes chore(release) x.y.z in the previous
      # job; building from the tag freezes the released version and is immune
      # to intermediate pushes to main.
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          # The build only verifies versions and compiles: a snapshot is enough.
          fetch-depth: 1
          persist-credentials: false

      - name: Verify version matches release (no drift)
        run: |
          EXPECTED="${{ needs.release.outputs.version }}"
          PY_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CARGO_VER=$(python3 -c "import tomllib; print(tomllib.load(open('rust-worker/Cargo.toml','rb'))['package']['version'])")
          echo "release=$EXPECTED pyproject=$PY_VER cargo=$CARGO_VER"
          if [ "$PY_VER" != "$EXPECTED" ] || [ "$CARGO_VER" != "$EXPECTED" ]; then
            echo "❌ version drift: pyproject=$PY_VER cargo=$CARGO_VER release=$EXPECTED"
            exit 1
          fi
          echo "✅ version $EXPECTED"

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain (musl target)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Build wheel + sdist
        # Same recipe as `just build`, plus the sdist for PyPI.
        run: |
          uv run maturin build --release \
            --manifest-path rust-worker/Cargo.toml \
            --target x86_64-unknown-linux-musl \
            --out dist
          uv run maturin sdist \
            --manifest-path rust-worker/Cargo.toml \
            --out dist
          ls -la dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ needs.release.outputs.version }}
          path: dist/*
          retention-days: 30

  publish-gh:
    name: Publish release on GitHub
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release publish creates/updates the Release
      actions: read # download the dists artifact

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          # semantic-release publish needs tags + history for notes/changelog
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-${{ needs.release.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          uv run semantic-release publish

  publish-pypi:
    name: Publish release on PyPI
    needs: [release, build, publish-gh]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      id-token: write
      actions: read # download the dists artifact
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-${{ needs.release.outputs.version }}
          path: dist

      - name: List dists
        run: ls -la dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
